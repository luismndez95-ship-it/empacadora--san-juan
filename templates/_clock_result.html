{% if ok %}
<div class="fade-in rounded-2xl p-4 text-center bg-emerald-500/10 border border-emerald-500/30">
  <p class="font-heading font-bold text-lg text-emerald-400">
    {{ "Entrada registrada" if action == "entrada" else "Salida registrada" }}
  </p>
  <p class="text-zinc-300 text-sm mt-1">{{ message }}</p>
</div>
{% else %}
<div class="fade-in rounded-2xl p-4 text-center bg-red-950/40 border border-red-500/30">
  <p class="font-heading font-bold text-red-400 text-sm">{{ message }}</p>
</div>
{% endif %}
