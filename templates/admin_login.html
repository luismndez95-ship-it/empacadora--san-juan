{% extends "base.html" %}
{% block title %}Acceso administrativo{% endblock %}
{% block body %}
<div class="flex-1 flex items-center justify-center volcano-hero px-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl border border-broccoli-100 p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-broccoli-600 text-cauliflower-50 text-2xl font-heading font-extrabold shadow mb-3">ESJ</div>
      <h1 class="font-heading font-bold text-xl text-broccoli-800">Panel administrativo</h1>
      <p class="text-broccoli-500 text-sm">Empacadora San Juan</p>
    </div>

    {% if error %}
    <div class="rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm p-3 mb-4 text-center">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-broccoli-700 mb-1">Usuario</label>
        <input name="username" required class="w-full rounded-xl border border-broccoli-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-broccoli-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-broccoli-700 mb-1">Contraseña</label>
        <input name="password" type="password" required class="w-full rounded-xl border border-broccoli-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-broccoli-400">
      </div>
      <button type="submit" class="w-full bg-broccoli-600 hover:bg-broccoli-700 text-white font-heading font-semibold rounded-xl py-2.5 shadow transition">Entrar</button>
    </form>

    <p class="text-center mt-6"><a href="/" class="text-broccoli-400 hover:text-broccoli-600 text-xs underline">Volver al kiosko de marcaje</a></p>
  </div>
</div>
{% endblock %}
