{% extends "base.html" %}
{% block title %}Acceso administrativo{% endblock %}
{% block body %}
<div class="flex-1 flex items-center justify-center px-4 relative overflow-hidden">
  <div class="relative z-10 w-full max-w-sm panel-card rounded-3xl shadow-2xl border border-ink-600 p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-ink-800 border border-emerald-500/30 shadow mb-3">
        <svg viewBox="0 0 100 100" class="w-8 h-8">
          <path d="M50 20c-16 0-28 12-28 28 0 4 1 8 3 11 4-2 9-3 14-3 3-9 6-14 11-19-2 7-3 13-3 19 2 0 3 0 4 0s2 0 4 0c0-6-1-12-3-19 5 5 8 10 11 19 5 0 10 1 14 3 2-3 3-7 3-11 0-16-12-28-28-28z" fill="#10b981"/>
        </svg>
      </div>
      <h1 class="font-heading font-bold text-xl text-cauliflower-50">Panel administrativo</h1>
      <p class="text-cauliflower-100/50 text-sm">Empacadora San Juan</p>
    </div>

    {% if error %}
    <div class="rounded-xl bg-red-950/40 border border-red-500/30 text-red-300 text-sm p-3 mb-4 text-center">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-cauliflower-100/70 mb-1">Usuario</label>
        <input name="username" required class="w-full rounded-xl bg-ink-800 border border-ink-500 text-cauliflower-50 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-cauliflower-100/70 mb-1">Contraseña</label>
        <input name="password" type="password" required class="w-full rounded-xl bg-ink-800 border border-ink-500 text-cauliflower-50 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-ink-950 font-heading font-bold rounded-xl py-2.5 shadow transition">Entrar</button>
    </form>

    <p class="text-center mt-6"><a href="/kiosko" class="text-cauliflower-100/40 hover:text-emerald-300 text-xs underline">Volver al kiosko de marcaje</a></p>
  </div>
</div>
{% endblock %}
