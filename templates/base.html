<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>

    theme: {
      extend: {

        colors: {
          broccoli: { 50:'#f2f7f0', 100:'#dfeada', 400:'#5c9a5f', 500:'#3f7d45', 600:'#2f6e42', 700:'#255736', 800:'#1f4529', 900:'#183a21' },

          irazu: { 400:'#6fa9a4', 500:'#4f8b86', 600:'#3d716d' },
          soil: { 500:'#8b5e3c', 600:'#71492c' },
        },
      },

<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="font-body bg-cauliflower-50 text-broccoli-900 min-h-screen flex flex-col">
