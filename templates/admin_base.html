{% extends "base.html" %}
{% block title %}{{ business_name }} - Admin{% endblock %}
{% block body %}
<div class="flex-1 flex flex-col p-4 sm:p-6 max-w-6xl w-full mx-auto">

  {% block header %}
  {% include "_top_header.html" %}
  {% endblock %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="w-full text-center py-6 border-t border-white/5 bg-zinc-950/80 backdrop-blur-md mt-10">
    <p class="text-[10px] text-zinc-500 uppercase tracking-widest">
      {{ business_name }} &bull; San Juan de Chicua, Cartago, Costa Rica
    </p>
  </footer>
</div>
{% endblock %}
