app = "empacadora-san-juan"
primary_region = "mia"  # Miami -- la region de Fly.io mas cercana a Costa Rica

[build]

[env]
LOCAL_DEV = ""

[[mounts]]
source = "empacadora_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
