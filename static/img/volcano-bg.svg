    <circle cx="90" cy="660" r="34" fill="#255736"/>
    <circle cx="140" cy="640" r="26" fill="#2f6e42"/>
    <circle cx="45" cy="645" r="22" fill="#2f6e42"/>
    <circle cx="180" cy="660" r="20" fill="#3f7d45"/>
    <circle cx="1420" cy="660" r="34" fill="#e5dfc9"/>
    <circle cx="1470" cy="642" r="26" fill="#efe9d6"/>
    <circle cx="1375" cy="648" r="22" fill="#efe9d6"/>
    <circle cx="1510" cy="662" r="18" fill="#f7f4ea"/>
    <circle cx="740" cy="672" r="24" fill="#255736" opacity="0.7"/>
    <circle cx="790" cy="660" r="18" fill="#2f6e42" opacity="0.7"/>
    <circle cx="850" cy="670" r="20" fill="#e5dfc9" opacity="0.7"/>
